    .dot{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.p{opacity:0}}</style><defs><clipPath id="im"><rect x="78" y="52" width="240" height="150" rx="3"/></clipPath></defs><rect width="900" height="258" fill="#0c2a1f"/>
