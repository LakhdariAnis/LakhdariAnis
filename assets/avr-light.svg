  <rect x="78" y="52" width="240" height="150" fill="#0f2e22" rx="3"/><text x="92" y="100.44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.3" fill="#e3efe7">UCSR0B = (1&lt;&lt;TXEN0);</text><text x="92" y="115.38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.3" fill="#e3efe7">UCSR0C = (1&lt;&lt;UCSZ01) | (1&lt;&lt;UCSZ00);</text><text x="92" y="130.32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.3" fill="#e3efe7">UBRR0L = 103;   // 9600 baud @ 16 MHz</text><text x="92" y="145.26" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.3" fill="#e3efe7">while (!(UCSR0A &amp; (1&lt;&lt;UDRE0)));</text><text x="92" y="160.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.3" fill="#e3efe7">UDR0 = c;</text><g class="bk" fill="none" stroke-width="2"><path d="M72 60V46H86"/><path d="M310 46H324V60"/><path d="M72 194V208H86"/><path d="M310 208H324V194"/></g>
  <rect x="350" y="20" width="172.6" height="22" rx="11" fill="none" stroke="#d3ddd5"/><circle class="dot" cx="363" cy="31" r="4" fill="#0969da"/><text x="374" y="35" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#52665b">Simulated in SimulIDE</text>
  <text x="350" y="72" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#12261d">AVR dual-node serial link</text>
  <text x="350" y="97" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#52665b">A keypad master sends each key over USART to a</text><text x="350" y="116" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#52665b">7-segment slave. USART and GPIO are set by hand</text><text x="350" y="135" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#52665b">in the registers: UCSR0B/C, UBRR0L, UDR0.</text>
  <rect x="350" y="146" width="117" height="24" rx="4" fill="#b08d22"/><text x="408.5" y="162.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ffffff">9600 baud · 8N1</text><rect x="474" y="146" width="64.19999999999999" height="24" rx="4" fill="#b08d22"/><text x="506.1" y="162.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#ffffff">2 nodes</text><rect x="350" y="182" width="37.8" height="22" rx="3" fill="none" stroke="#52665b"/><text x="368.9" y="197" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#12261d">C++</text><rect x="394.8" y="182" width="64.19999999999999" height="22" rx="3" fill="none" stroke="#52665b"/><text x="426.9" y="197" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#12261d">AVR-GCC</text><rect x="466" y="182" width="70.8" height="22" rx="3" fill="none" stroke="#52665b"/><text x="501.4" y="197" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#12261d">avr-libc</text><rect x="543.8" y="182" width="70.8" height="22" rx="3" fill="none" stroke="#52665b"/><text x="579.1999999999999" y="197" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#12261d">SimulIDE</text>
